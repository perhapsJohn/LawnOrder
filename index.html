		<!-- Lawn Order web shell (web/shell.html, the Web preset's custom_html_shell).
		     The edition's palette (data/main/edition.json): dusk over the lawn, so
		     loading and the title read as one thing, in the Scareathon arcade iframe
		     or alone. tools/export_web.py fills in the phone pack's size. -->
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	background: #2d2438;
	color: #fffaf0;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background: linear-gradient(#2d2438 0%, #3d2f4a 50%, #5a7a3c 82%, #7cc452 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	gap: 0.8rem;
	visibility: hidden;
	text-align: center;
	padding: 1.5rem;
	box-sizing: border-box;
	font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
}
#status-title {
	font-family: 'Chewy', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
	font-weight: 800;
	font-size: clamp(2.6rem, 11vw, 4.6rem);
	line-height: 1;
	color: #fff4d6;
	-webkit-text-stroke: 2px #5a3222;
	text-shadow: 0 4px 0 #5a3222, 0 6px 14px rgba(0, 0, 0, 0.45);
}
#status-tag { color: #ffe08a; font-size: clamp(0.95rem, 3.6vw, 1.15rem); }
#status-bar {
	width: min(64vw, 300px); height: 12px; margin-top: 0.6rem;
	border-radius: 999px; background: rgba(42, 26, 20, 0.5); overflow: hidden;
	display: none;
}
#status-fill {
	height: 100%; width: 0%;
	background: linear-gradient(90deg, #f2853a, #ffd84d);
	border-radius: 999px;
	transition: width 0.2s ease-out;
}
#status-fill.indeterminate { width: 35%; animation: slide 1.2s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0%; } to { margin-left: 65%; } }
#status-notice {
	display: none;
	background: #fff4e2; color: #4a3226;
	border-radius: 16px; line-height: 1.45;
	max-width: 30rem; padding: 1rem 1.25rem;
	box-shadow: 0 6px 14px rgba(0, 0, 0, 0.38);
}
#status-splash { display: none; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Lawn Order needs JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-title">Lawn Order</div>
			<div id="status-tag">Mowing the stripes&hellip;</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<script>
// Audio unlock. Browsers keep audio suspended until a user gesture, and iOS
// Safari only lets it start *inside* one (synchronously in the handler). The
// engine makes its AudioContext out of reach, so the constructor is wrapped
// here, before the engine loads, and every instance is recorded. Each tap /
// click / key then:
//   * on iOS, sets navigator.audioSession to "playback" (iOS 17+) and plays a
//     silent looping <audio>, so the ring/silent switch does not mute the game;
//   * resumes every context that is not running.
// The listeners stay: iOS suspends ("interrupted") on calls and app switches.
// (Same unlock as the sibling Godot games' shells.)
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	const ua = navigator.userAgent;
	const IOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
	let gestured = false;
	let tag = null;
	window.loAudioContexts = ctxs;
	if (AC) {
		const Wrapped = function (...args) { const c = new AC(...args); ctxs.push(c); return c; };
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// 0.5 s of 8-bit silence (a WAV built here: no extra file to fetch)
	function silentWav() {
		const rate = 8000, n = 4000, v = new DataView(new ArrayBuffer(44 + n));
		const str = (o, t) => { for (let i = 0; i < t.length; i++) { v.setUint8(o + i, t.charCodeAt(i)); } };
		str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
		v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
		v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		str(36, 'data'); v.setUint32(40, n, true);
		for (let i = 0; i < n; i++) { v.setUint8(44 + i, 128); }
		return URL.createObjectURL(new Blob([v.buffer], { type: 'audio/wav' }));
	}
	function playbackSession() {
		if (!IOS || document.hidden) { return; }
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* older iOS */ }
		if (!tag) {
			tag = document.createElement('audio');
			tag.setAttribute('playsinline', '');
			tag.setAttribute('x-webkit-airplay', 'deny');
			tag.disableRemotePlayback = true;
			tag.loop = true;
			tag.preload = 'auto';
			tag.src = silentWav();
		}
		if (tag.paused) { const p = tag.play(); if (p) { p.catch(() => {}); } }
	}
	function unlock(ev) {
		if (ev && ev.isTrusted === false) { return; }
		playbackSession();
		if (ctxs.length > 0) { gestured = true; }
		ctxs.forEach((c) => {
			if (c.state !== 'running' && c.state !== 'closed') { const p = c.resume(); if (p) { p.catch(() => {}); } }
		});
	}
	['pointerdown', 'pointerup', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'].forEach((e) =>
		window.addEventListener(e, unlock, { capture: true, passive: true }));
	// the silent loop would show in the lock screen's player: pause it while hidden
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			if (tag && !tag.paused) { tag.pause(); }
		} else if (gestured) {
			playbackSession();
			ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(() => {}); } });
		}
	});
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9931440,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// Phones and tablets load the phone pack (touch controls, the 1280 x 720
// layout, no desktop-only music); desktops the full one. Only the chosen pack
// downloads. ?pack=mobile|desktop forces one.
const LO_PACK = new URLSearchParams(location.search).get('pack');
const LO_MOBILE = LO_PACK ? LO_PACK === 'mobile' : (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
	|| (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))
	|| (window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches));
if (LO_MOBILE) {
	GODOT_CONFIG.mainPack = 'index.mobile.pck';
	GODOT_CONFIG.fileSizes = { 'index.mobile.pck': 6032524, 'index.wasm': GODOT_CONFIG.fileSizes['index.wasm'] };
}
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	let initializing = true;
	let mode = '';

	function setMode(m) {
		if (mode === m || !initializing) { return; }
		if (m === 'hidden') { overlay.remove(); initializing = false; return; }
		overlay.style.visibility = 'visible';
		bar.style.display = m === 'progress' ? 'block' : 'none';
		notice.style.display = m === 'notice' ? 'block' : 'none';
		mode = m;
	}

	function fail(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong loading the neighbourhood.');
		notice.textContent = '';
		text.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
		setMode('notice');
		initializing = false;
	}

	// Keep keyboard focus on the game after taps on the page.
	document.addEventListener('pointerdown', () => {
		const c = document.getElementById('canvas');
		if (c && document.activeElement !== c) { c.focus(); }
	}, true);
	// The page itself never zooms (pinch, double-tap).
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs:\n' + missing.join('\n') + '\nTry a current Chrome, Edge, Firefox or Safari.');
		return;
	}
	setMode('progress');
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.classList.remove('indeterminate');
				fill.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
			} else {
				fill.classList.add('indeterminate');
			}
		},
	}).then(() => setMode('hidden'), fail);
}());
		</script>
	</body>
